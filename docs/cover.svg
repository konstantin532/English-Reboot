<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     role="img" aria-labelledby="cover-title cover-desc">
  <title id="cover-title">English Reboot — офлайн SPA для изучения английского</title>
  <desc id="cover-desc">Vanilla JS SPA, интервальное повторение (SRS), 673 карточки, уровни A1–B2+, офлайн-first PWA на IndexedDB. Справа — макет учебной карточки со словом knight.</desc>

  <defs>
    <!-- 4 радиальных «пятна» — mesh-градиент по углам -->
    <radialGradient id="glow-tl">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity="0.55"/>
      <stop offset="45%"  stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-tr">
      <stop offset="0%"   stop-color="#A855F7" stop-opacity="0.50"/>
      <stop offset="45%"  stop-color="#A855F7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-br">
      <stop offset="0%"   stop-color="#EC4899" stop-opacity="0.45"/>
      <stop offset="45%"  stop-color="#EC4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-bl">
      <stop offset="0%"   stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="45%"  stop-color="#3B82F6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <!-- тёмная подложка -->
  <rect width="1280" height="640" fill="#0F1419"/>

  <circle cx="-40"  cy="-60" r="560" fill="url(#glow-tl)"/>
  <circle cx="1320" cy="-40" r="540" fill="url(#glow-tr)"/>
  <circle cx="1340" cy="690" r="560" fill="url(#glow-br)"/>
  <circle cx="-60"  cy="700" r="540" fill="url(#glow-bl)"/>

  <!-- левая колонка -->
  <text x="80" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">English Reboot</text>
  <text x="80" y="342" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#FFFFFF" fill-opacity="0.85">Vanilla JS SPA · SRS · 673 карточки · A1–B2+</text>
  <text x="80" y="564" font-family="ui-monospace, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="20" fill="#FFFFFF" fill-opacity="0.6" letter-spacing="1">IndexedDB · PWA · Offline-first · MIT</text>

  <!-- макет учебной карточки: тень, «эхо»-плашки для глубины, стекло -->
  <rect x="776" y="158" width="408" height="372" rx="18" fill="#000000" opacity="0.4" filter="url(#soft-blur)"/>
  <rect x="812" y="106" width="420" height="380" rx="16" fill="#FFFFFF" opacity="0.04" transform="rotate(-5 1022 296)"/>
  <rect x="724" y="170" width="420" height="380" rx="16" fill="#FFFFFF" opacity="0.05" transform="rotate(3 934 360)"/>
  <rect x="760" y="130" width="420" height="380" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- содержимое карточки -->
  <text x="970" y="270" text-anchor="middle" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="600" fill="#FFFFFF" letter-spacing="1">knight</text>
  <text x="970" y="320" text-anchor="middle" font-family="ui-monospace, 'Cascadia Code', Consolas, 'DejaVu Sans Mono', monospace" font-size="26" fill="#FFFFFF" fill-opacity="0.75">/naɪt/</text>
  <line x1="884" y1="350" x2="1056" y2="350" stroke="#FFFFFF" stroke-opacity="0.12"/>

  <g font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="16">
    <rect x="834" y="378" width="106" height="34" rx="17" fill="#6366F1" fill-opacity="0.30" stroke="#818CF8" stroke-opacity="0.45"/>
    <text x="887" y="400" text-anchor="middle" fill="#E0E7FF">немая k</text>
    <rect x="954" y="378" width="152" height="34" rx="17" fill="#EC4899" fill-opacity="0.24" stroke="#F9A8D4" stroke-opacity="0.40"/>
    <text x="1030" y="400" text-anchor="middle" fill="#FCE7F3">ударение на i</text>
  </g>

  <!-- нижний ряд карточки: аудио (SpeechSynthesis) и прогресс в колоде -->
  <g transform="translate(794 462)" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -5 H7 L14 -11 V17 L7 11 H0 Z" fill="#FFFFFF" fill-opacity="0.5" stroke="none"/>
    <path d="M20 -4 A8 8 0 0 1 20 10" fill="none"/>
    <path d="M26 -8 A12 12 0 0 1 26 14" fill="none"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="1106" cy="465" r="4" fill-opacity="0.55"/>
    <circle cx="1122" cy="465" r="4" fill-opacity="0.55"/>
    <circle cx="1138" cy="465" r="4" fill-opacity="0.20"/>
  </g>
</svg>