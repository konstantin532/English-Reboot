name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-report.json

      # Число тестов — аннотацией: её читает scripts/er-ci.mjs через REST (лог задания из облачной сессии не скачать)
      # и сверяет с локальным прогоном на шиме — шим, запускающий не все тесты, виден сразу
      - name: Publish unit test count
        if: always()
        run: node -e "try { const r = require('./vitest-report.json'); console.log('::notice title=vitest-total::' + r.numTotalTests + ' tests, failed ' + r.numFailedTests); } catch (e) { console.log('::warning title=vitest-total::no vitest-report.json'); }"

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (Playwright)
        run: npx playwright test

      - name: Re-shoot README screenshots
        run: npm run test:screenshots

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  # Сайт для GitHub Pages: на каждом PR и push собирается тот же dist/, что уйдёт ученику, и проверяется
  # (файлы из кэша sw.js, подключения index.html, иконки manifest.json, нет служебных папок).
  # Публикует его отдельный workflow deploy-pages.yml — только после зелёного CI на push в main,
  # поэтому здесь нет условия «только main» и в PR это задание не пропускается.
  pages:
    name: pages
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build and check dist/
        run: node scripts/build-pages.mjs

      - name: Upload site preview
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          retention-days: 7
        