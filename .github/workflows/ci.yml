name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-report.json

      # Число тестов — аннотацией: её читает scripts/er-ci.mjs через REST (лог задания из облачной сессии не скачать)
      # и сверяет с локальным прогоном на шиме — шим, запускающий не все тесты, виден сразу
      - name: Publish unit test count
        if: always()
        run: node -e "try { const r = require('./vitest-report.json'); console.log('::notice title=vitest-total::' + r.numTotalTests + ' tests, failed ' + r.numFailedTests); } catch (e) { console.log('::warning title=vitest-total::no vitest-report.json'); }"

      - name: Install Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (Playwright)
        run: npx playwright test

      - name: Re-shoot README screenshots
        run: npm run test:screenshots

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  pages:
    name: pages
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Prepare dist/ (exclude dev directories)
        run: |
          mkdir -p dist
          rsync -a \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude 'scripts/' \
            --exclude '.github/' \
            --exclude '.git/' \
            --exclude '.claude/' \
            --exclude '.gitignore' \
            --exclude 'test-results/' \
            --exclude 'playwright-report/' \
            --exclude 'dist/' \
            ./ dist/
          echo '--- dist/ ---'
          ls dist/

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        